name: Alta CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Run Backend Tests
        env:
          SECRET_KEY: ci_secret_key_12345678901234567890
          JWT_SECRET: ci_secret_key_12345678901234567890
          PYTHONPATH: .
        run: |
          cd backend
          pytest tests/test_clinical_document_pipeline.py tests/test_billing_and_charge_master.py tests/test_payments_and_webhooks.py tests/test_rbac_four_roles.py tests/test_health.py tests/test_patient_isolation.py tests/test_receiving_transfers.py tests/test_full_system_e2e.py tests/test_feature7_e2e.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  deploy-ec2:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/alta
            git pull origin main
            sudo docker compose up -d --build
            sudo docker exec discharge_orchestration_backend alembic upgrade head
            sudo docker exec discharge_orchestration_backend python -m app.db.seed
            cd /home/ubuntu/alta/frontend
            npm install
            npm run build
            sudo chmod o+x /home /home/ubuntu /home/ubuntu/alta /home/ubuntu/alta/frontend /home/ubuntu/alta/frontend/dist
            sudo systemctl reload nginx

      - name: Verify Live Deployment Health
        run: |
          echo "Verifying backend health on staging..."
          curl --fail --retry 5 --retry-delay 3 https://${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}/api/health
