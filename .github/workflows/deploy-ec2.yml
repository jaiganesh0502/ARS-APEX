name: Alta CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Run Backend Tests
        run: |
          cd backend
          pytest tests/ -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests
        run: |
          cd frontend
          npm run test -- --run

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  deploy-ec2:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/alta
            git pull origin main
            sudo docker compose up -d --build
            sudo docker exec discharge_orchestration_backend alembic upgrade head
            sudo docker exec discharge_orchestration_backend python -m app.db.seed
            sudo systemctl reload nginx

      - name: Verify Live Deployment Health
        run: |
          echo "Verifying backend health on staging..."
          curl --fail --retry 5 --retry-delay 3 https://${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}/api/health

