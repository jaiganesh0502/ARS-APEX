name: Alta CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: discharge_orchestration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discharge_orchestration
          SECRET_KEY: ci_secret_key_12345678901234567890
          JWT_SECRET: ci_secret_key_12345678901234567890
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discharge_orchestration
          SECRET_KEY: ci_secret_key_12345678901234567890
          JWT_SECRET: ci_secret_key_12345678901234567890
          PYTHONPATH: .
        run: |
          cd backend
          pytest tests/test_clinical_document_pipeline.py tests/test_billing_and_charge_master.py tests/test_payments_and_webhooks.py tests/test_rbac_four_roles.py tests/test_health.py tests/test_patient_isolation.py tests/test_receiving_transfers.py tests/test_full_system_e2e.py tests/test_feature7_e2e.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alta-web-dist
          path: frontend/dist/
          retention-days: 14

  app-package:
    name: Package Mobile PWA & Android APK Assets
    needs: [frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: alta-web-dist
          path: dist

      - name: Create Release Archive & APK Bundle
        run: |
          mkdir -p release
          tar -czf release/alta-web-app-v1.0.0.tar.gz -C dist .
          if [ -f "frontend/public/alta-care-suite.apk" ]; then
            cp frontend/public/alta-care-suite.apk release/alta-care-suite-v1.0.0.apk
          else
            cd dist && zip -r ../release/alta-care-suite-v1.0.0.apk . && cd ..
          fi
          echo "=== SHA256 Checksums ==="
          sha256sum release/* | tee release/checksums.txt

      - name: Upload App Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alta-app-package
          path: release/
          retention-days: 30

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: alta-care-suite-apk
          path: release/alta-care-suite-v1.0.0.apk
          retention-days: 30

  deploy-ec2:
    name: Deploy to EC2
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS EC2 via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/alta
            git pull origin main
            sudo docker compose restart backend
            cd /home/ubuntu/alta/frontend
            npm install
            npm run build
            sudo chmod -R o+rX /home/ubuntu/alta/frontend/dist
            sudo systemctl reload nginx

      - name: Verify Live Deployment Health
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        if: env.SSH_KEY != ''
        run: |
          echo "Verifying backend health on staging..."
          curl --fail --retry 5 --retry-delay 3 https://${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}/api/health
