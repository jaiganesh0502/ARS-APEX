name: Alta CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: discharge_orchestration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discharge_orchestration
          SECRET_KEY: ci_secret_key_12345678901234567890
          JWT_SECRET: ci_secret_key_12345678901234567890
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/discharge_orchestration
          SECRET_KEY: ci_secret_key_12345678901234567890
          JWT_SECRET: ci_secret_key_12345678901234567890
          PYTHONPATH: .
        run: |
          cd backend
          pytest tests/test_clinical_document_pipeline.py tests/test_billing_and_charge_master.py tests/test_payments_and_webhooks.py tests/test_rbac_four_roles.py tests/test_health.py tests/test_patient_isolation.py tests/test_receiving_transfers.py tests/test_full_system_e2e.py tests/test_feature7_e2e.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alta-web-dist
          path: frontend/dist/
          retention-days: 14

  build-android-apk:
    name: Compile Native Android APK (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Wrapper & Build Android APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: alta-native-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  deploy-ec2:
    name: Deploy to EC2
    needs: [backend-test, frontend-build, build-android-apk]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Compiled APK
        uses: actions/download-artifact@v4
        with:
          name: alta-native-apk
          path: apk-dist

      - name: Copy Compiled APK to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        if: env.SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "apk-dist/app-debug.apk"
          target: "/home/ubuntu/alta/frontend/public/"
          strip_components: 1

      - name: Deploy & Host APK via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        if: env.SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/alta
            git pull origin main
            sudo docker compose restart backend
            if [ -f "/home/ubuntu/alta/frontend/public/app-debug.apk" ]; then
              cp /home/ubuntu/alta/frontend/public/app-debug.apk /home/ubuntu/alta/frontend/public/alta-react-native-app.apk
              cp /home/ubuntu/alta/frontend/public/app-debug.apk /home/ubuntu/alta/frontend/public/alta-care-suite.apk
            fi
            cd /home/ubuntu/alta/frontend
            npm install
            npm run build
            if [ -f "/home/ubuntu/alta/frontend/public/app-debug.apk" ]; then
              cp /home/ubuntu/alta/frontend/public/app-debug.apk /home/ubuntu/alta/frontend/dist/alta-react-native-app.apk
              cp /home/ubuntu/alta/frontend/public/app-debug.apk /home/ubuntu/alta/frontend/dist/alta-care-suite.apk
            fi
            sudo chmod -R o+rX /home/ubuntu/alta/frontend/dist /home/ubuntu/alta/frontend/public
            sudo systemctl reload nginx

      - name: Verify Live Deployment Health
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        if: env.SSH_KEY != ''
        run: |
          echo "Verifying backend health on staging..."
          curl --fail --retry 5 --retry-delay 3 https://${{ secrets.EC2_HOST || 'altaa.duckdns.org' }}/api/health
