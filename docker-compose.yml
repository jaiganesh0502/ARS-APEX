version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: discharge_orchestration_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discharge_orchestration}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-discharge_orchestration}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional backend container for containerized runtime
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: discharge_orchestration_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-discharge_orchestration}
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
  # n8n Workflow Orchestrator
  n8n:
    image: n8nio/n8n:latest
    container_name: discharge_orchestration_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
